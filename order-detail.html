<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#d94f4f" />
  <title>我的訂單｜邱媽媽美食</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #d94f4f;
      --brand-soft: #fff3f1;
      --ink: #232629;
      --muted: #6f7479;
      --line: #e8e9ea;
      --surface: #ffffff;
      --page: #f5f6f4;
      --amber: #d97706;
      --amber-soft: #fff7e8;
      --blue: #2474c7;
      --blue-soft: #eef6ff;
      --green: #188653;
      --green-soft: #edf9f2;
      --gray-soft: #f1f3f4;
      --shadow: 0 8px 24px rgba(30, 35, 40, .08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--page); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Noto Sans TC", sans-serif;
      letter-spacing: 0;
    }
    button, a { font: inherit; }
    button { letter-spacing: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 60px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      padding: 0 14px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      min-width: 0;
      text-align: center;
      font-size: 1.02rem;
      font-weight: 800;
    }
    .brand small { display: block; color: var(--muted); font-size: .67rem; font-weight: 500; }
    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }
    .icon-button:active { background: var(--gray-soft); transform: scale(.94); }
    .icon-button svg { width: 22px; height: 22px; }
    main { width: min(680px, 100%); margin: 0 auto; padding: 18px 14px 110px; }
    .state {
      min-height: 62vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .state-box { max-width: 320px; }
    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 16px;
      border: 3px solid #e4e5e6;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state h2 { margin: 0 0 8px; color: var(--ink); font-size: 1.2rem; }
    .state p { margin: 0; line-height: 1.7; }
    .current-order {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      animation: rise .42s ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .order-hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 20px 18px;
      background: var(--brand-soft);
      border-bottom: 1px solid #f1deda;
    }
    .eyebrow { color: var(--muted); font-size: .75rem; font-weight: 700; }
    .order-number { margin-top: 2px; font-size: 2rem; line-height: 1.15; font-weight: 800; }
    .amount { color: var(--brand); font-size: 1.8rem; line-height: 1.15; font-weight: 800; white-space: nowrap; }
    .status-block { padding: 20px; border-bottom: 1px solid var(--line); }
    .status-heading { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 22px; }
    .status-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--amber);
      background: var(--amber-soft);
    }
    .status-icon svg { width: 20px; height: 20px; }
    .status-title { font-weight: 800; }
    .status-copy { margin-top: 3px; color: var(--muted); font-size: .86rem; line-height: 1.5; }
    .status-block.preparing .status-icon { color: var(--blue); background: var(--blue-soft); animation: breathe 1.8s ease-in-out infinite; }
    .status-block.completed .status-icon { color: var(--green); background: var(--green-soft); animation: completePop .55s ease-out both; }
    .status-block.cancelled .status-icon { color: #666; background: var(--gray-soft); }
    @keyframes breathe { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(36, 116, 199, .08); } }
    @keyframes completePop { 0% { transform: scale(.7); } 65% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .progress-shell { position: relative; padding: 0 4px; }
    .progress-track {
      position: absolute;
      top: 15px;
      left: 17%;
      right: 17%;
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: #e5e7e8;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
      transition: width .9s cubic-bezier(.2, .8, .2, 1);
    }
    .progress-fill.moving { position: relative; }
    .progress-fill.moving::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      background: rgba(255, 255, 255, .55);
      animation: sweep 1.5s ease-in-out infinite;
    }
    @keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
    .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); }
    .step { text-align: center; color: #9a9da0; font-size: .72rem; font-weight: 700; }
    .step-dot {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      margin: 0 auto 7px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      color: #8e9295;
      background: #e5e7e8;
      box-shadow: 0 0 0 1px #dde0e2;
      transition: color .35s, background .35s, transform .35s;
    }
    .step-dot svg { width: 14px; height: 14px; }
    .step.done, .step.active { color: var(--ink); }
    .step.done .step-dot, .step.active .step-dot { color: #fff; background: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .step.active .step-dot { animation: stepPulse 1.8s ease-in-out infinite; }
    @keyframes stepPulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(217, 79, 79, .11); } }
    .order-section { padding: 20px; border-bottom: 1px solid var(--line); }
    .section-title { margin: 0 0 14px; font-size: .95rem; font-weight: 800; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    .meta-label { margin-bottom: 3px; color: var(--muted); font-size: .72rem; }
    .meta-value { font-size: .9rem; font-weight: 700; line-height: 1.45; word-break: break-word; }
    .items { display: grid; gap: 13px; }
    .item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
    .item-name { min-width: 0; font-size: .9rem; font-weight: 700; line-height: 1.45; }
    .item-name span { margin-left: 5px; color: var(--muted); font-weight: 500; }
    .item-subtotal { font-size: .9rem; font-weight: 700; white-space: nowrap; }
    .notes {
      margin-top: 15px;
      padding: 11px 12px;
      color: #75520c;
      background: var(--amber-soft);
      border-left: 3px solid #e0a12b;
      border-radius: 4px;
      font-size: .84rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px 20px; }
    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .button svg { width: 18px; height: 18px; }
    .button.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .button:active { transform: scale(.98); }
    .button:disabled { opacity: .6; cursor: wait; }
    .history { margin-top: 28px; }
    .history-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 12px; }
    .history-head h2 { margin: 0; font-size: 1.15rem; }
    .history-count { color: var(--muted); font-size: .78rem; }
    .history-list { display: grid; gap: 10px; }
    .history-card {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 15px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      animation: rise .36s ease-out both;
    }
    .history-card.selected { border-color: #e7aaa3; box-shadow: 0 0 0 2px rgba(217, 79, 79, .08); }
    .history-no { font-weight: 800; }
    .history-date, .history-items { margin-top: 3px; color: var(--muted); font-size: .76rem; line-height: 1.45; }
    .history-side { text-align: right; }
    .history-total { margin-top: 6px; font-weight: 800; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: .7rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge.pending { color: #975a00; background: var(--amber-soft); }
    .badge.preparing { color: #145ca5; background: var(--blue-soft); }
    .badge.completed { color: #126e43; background: var(--green-soft); }
    .badge.cancelled { color: #666; background: var(--gray-soft); }
    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      width: max-content;
      max-width: calc(100% - 28px);
      padding: 11px 15px;
      color: #fff;
      background: #25282b;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity .25s, transform .25s;
      font-size: .84rem;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .notice-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(20, 24, 28, .52);
    }
    .notice-backdrop.show { display: grid; }
    .notice-dialog {
      width: min(420px, 100%);
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(0,0,0,.22);
      animation: dialogIn .28s ease-out both;
    }
    @keyframes dialogIn { from { opacity: 0; transform: scale(.96) translateY(8px); } }
    .notice-body { padding: 20px; }
    .notice-body h3 { margin: 0 0 8px; font-size: 1.08rem; }
    .notice-body p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.6; }
    .notice-list { display: grid; gap: 8px; margin-top: 14px; }
    .notice-row { padding: 10px; border-radius: 6px; background: var(--gray-soft); font-size: .82rem; line-height: 1.5; }
    .notice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    [hidden] { display: none !important; }
    @media (max-width: 420px) {
      .order-hero { align-items: flex-start; }
      .order-number { font-size: 1.75rem; }
      .amount { font-size: 1.55rem; }
      .meta-grid { grid-template-columns: 1fr; gap: 11px; }
      .actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="icon-button" href="index.html" aria-label="返回菜單">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="brand">我的訂單<small>邱媽媽美食</small></div>
    <button class="icon-button" id="refresh-button" type="button" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div class="state" id="loading-state">
    <div class="state-box"><div class="loader"></div><p>正在讀取您的訂單</p></div>
  </div>

  <div class="state" id="error-state" hidden>
    <div class="state-box">
      <h2 id="error-title">讀取失敗</h2>
      <p id="error-copy">請重新開啟頁面再試一次。</p>
      <button class="button primary" id="retry-button" type="button" style="margin-top:18px;width:100%;">重新整理</button>
    </div>
  </div>

  <main id="app" hidden>
    <section class="current-order" id="current-order">
      <div class="order-hero">
        <div><div class="eyebrow">訂單編號</div><div class="order-number" id="current-number"></div></div>
        <div class="amount" id="current-amount"></div>
      </div>

      <div class="status-block" id="status-block">
        <div class="status-heading">
          <div class="status-icon" id="status-icon"></div>
          <div><div class="status-title" id="status-title"></div><div class="status-copy" id="status-copy"></div></div>
        </div>
        <div class="progress-shell" id="progress-shell">
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="steps">
            <div class="step" data-step="0"><div class="step-dot"></div><span>已送出</span></div>
            <div class="step" data-step="1"><div class="step-dot"></div><span>製作中</span></div>
            <div class="step" data-step="2"><div class="step-dot"></div><span>可取餐</span></div>
          </div>
        </div>
      </div>

      <div class="order-section">
        <h2 class="section-title">訂單資訊</h2>
        <div class="meta-grid" id="order-meta"></div>
      </div>
      <div class="order-section">
        <h2 class="section-title">餐點明細</h2>
        <div class="items" id="current-items"></div>
        <div class="notes" id="current-notes" hidden></div>
      </div>
      <div class="actions">
        <button class="button primary" id="reorder-current" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          再買一次
        </button>
        <a class="button" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7v13h12V7"/><path d="M9 4h6l1 3H8z"/><path d="M9 11h6"/></svg>
          返回菜單
        </a>
      </div>
    </section>

    <section class="history">
      <div class="history-head"><h2>訂單紀錄</h2><span class="history-count" id="history-count"></span></div>
      <div class="history-list" id="history-list"></div>
    </section>
  </main>

  <div class="state" id="empty-state" hidden>
    <div class="state-box">
      <h2>還沒有訂單</h2>
      <p>完成第一筆訂購後，訂單狀態與歷史紀錄會顯示在這裡。</p>
      <a class="button primary" href="index.html" style="margin-top:18px;width:100%;">開始點餐</a>
    </div>
  </div>

  <div class="notice-backdrop" id="notice-backdrop" aria-hidden="true">
    <div class="notice-dialog" role="dialog" aria-modal="true" aria-labelledby="notice-title">
      <div class="notice-body">
        <h3 id="notice-title"></h3>
        <p id="notice-copy"></p>
        <div class="notice-list" id="notice-list"></div>
      </div>
      <div class="notice-actions">
        <button class="button" id="notice-close" type="button">留在這裡</button>
        <button class="button primary" id="notice-action" type="button">前往購物車</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const LIFF_ID = "2007831775-ojeB1qbw";
    const BACKEND_BASE_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? location.origin
      : "https://person-solid-resolution-unified.trycloudflare.com";
    const ICONS = {
      pending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      preparing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h16a8 8 0 0 1-16 0z"/><path d="M12 6V3"/><path d="M7 8c1-2 2-3 5-3s4 1 5 3"/></svg>',
      completed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
      cancelled: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 12 4 4 8-8"/></svg>',
      dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>'
    };
    const STATUS = {
      pending: { label: "等待店家接單", copy: "訂單已送達店家，接單後會開始製作。", step: 0, width: 7 },
      preparing: { label: "餐點製作中", copy: "店家已接單，正在為您準備餐點。", step: 1, width: 50 },
      completed: { label: "訂單已備妥", copy: "餐點已完成，可以前往店家取餐。", step: 2, width: 100 },
      cancelled: { label: "訂單已取消", copy: "此筆訂單未成立，如有疑問請聯絡店家。", step: -1, width: 100 }
    };

    let idToken = "";
    let orders = [];
    let selectedOrderId = new URLSearchParams(location.search).get("order") || "";
    let renderSignature = "";
    let noticeAction = null;
    let toastTimer = null;

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function money(value) {
      return "$" + Number(value || 0).toLocaleString("zh-TW");
    }

    function formatTime(value) {
      if (!value) return "未提供";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function paymentLabel(value) {
      if (value === "cash") return "現金付款";
      if (value === "linepay_online") return "LINE Pay";
      if (value === "online_payment") return "線上付款";
      return value || "未提供";
    }

    function statusConfig(status) {
      return STATUS[status] || STATUS.pending;
    }

    async function requestJson(path, options) {
      const config = options || {};
      const response = await fetch(BACKEND_BASE_URL + path, {
        ...config,
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + idToken,
          ...(config.headers || {})
        }
      });
      const data = await response.json().catch(function() { return {}; });
      if (!response.ok) throw new Error(data.message || "讀取失敗（" + response.status + "）");
      return data;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove("show"); }, 2200);
    }

    function showError(title, copy) {
      document.getElementById("loading-state").hidden = true;
      document.getElementById("app").hidden = true;
      document.getElementById("empty-state").hidden = true;
      document.getElementById("error-title").textContent = title;
      document.getElementById("error-copy").textContent = copy;
      document.getElementById("error-state").hidden = false;
    }

    function selectedOrder() {
      return orders.find(function(order) { return order.id === selectedOrderId; }) || orders[0] || null;
    }

    function setSelectedOrder(id) {
      selectedOrderId = id;
      const url = new URL(location.href);
      url.searchParams.set("order", id);
      history.replaceState({}, document.title, url.pathname + url.search);
      renderSignature = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderProgress(order) {
      const config = statusConfig(order.status);
      const block = document.getElementById("status-block");
      block.className = "status-block " + order.status;
      document.getElementById("status-icon").innerHTML = ICONS[order.status] || ICONS.pending;
      document.getElementById("status-title").textContent = config.label;
      document.getElementById("status-copy").textContent = config.copy;

      const shell = document.getElementById("progress-shell");
      shell.hidden = order.status === "cancelled";
      document.querySelectorAll(".step").forEach(function(step) {
        const index = Number(step.dataset.step);
        step.classList.toggle("done", config.step > index);
        step.classList.toggle("active", config.step === index);
        step.querySelector(".step-dot").innerHTML = config.step > index ? ICONS.check : ICONS.dot;
      });

      const fill = document.getElementById("progress-fill");
      fill.classList.toggle("moving", order.status === "pending" || order.status === "preparing");
      fill.style.width = "0";
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { fill.style.width = config.width + "%"; });
      });
    }

    function renderCurrent(order) {
      document.getElementById("current-number").textContent = "#" + order.orderNumber;
      document.getElementById("current-amount").textContent = money(order.totalAmount);
      renderProgress(order);

      document.getElementById("order-meta").innerHTML =
        '<div><div class="meta-label">下單時間</div><div class="meta-value">' + escapeHtml(formatTime(order.createdAt)) + '</div></div>' +
        '<div><div class="meta-label">取餐時間</div><div class="meta-value">' + escapeHtml(order.pickupTime || "待確認") + '</div></div>' +
        '<div><div class="meta-label">訂單類型</div><div class="meta-value">' + (order.orderType === "reserve" ? "預約單" : "即時單") + '</div></div>' +
        '<div><div class="meta-label">付款方式</div><div class="meta-value">' + escapeHtml(paymentLabel(order.paymentMethod)) + '</div></div>';

      document.getElementById("current-items").innerHTML = order.items.map(function(item) {
        return '<div class="item-row"><div class="item-name">' + escapeHtml(item.name) +
          '<span>x' + Number(item.qty || 0) + '</span></div><div class="item-subtotal">' +
          money(item.subtotal) + '</div></div>';
      }).join("");

      const notes = document.getElementById("current-notes");
      notes.hidden = !order.notes;
      notes.textContent = order.notes ? "備註：" + order.notes : "";
      document.getElementById("reorder-current").dataset.orderId = order.id;
    }

    function renderHistory() {
      document.getElementById("history-count").textContent = "共 " + orders.length + " 筆";
      document.getElementById("history-list").innerHTML = orders.map(function(order, index) {
        const config = statusConfig(order.status);
        const itemNames = order.items.slice(0, 2).map(function(item) { return item.name; }).join("、");
        const more = order.items.length > 2 ? " 等 " + order.items.length + " 項" : "";
        return '<button class="history-card ' + (order.id === selectedOrderId ? "selected" : "") +
          '" type="button" data-order-id="' + escapeHtml(order.id) + '" style="animation-delay:' + Math.min(index, 8) * 45 + 'ms">' +
          '<div><div class="history-no">#' + escapeHtml(order.orderNumber) + '</div>' +
          '<div class="history-date">' + escapeHtml(formatTime(order.createdAt)) + '</div>' +
          '<div class="history-items">' + escapeHtml(itemNames + more) + '</div></div>' +
          '<div class="history-side"><span class="badge ' + escapeHtml(order.status) + '">' + escapeHtml(config.label) +
          '</span><div class="history-total">' + money(order.totalAmount) + '</div></div></button>';
      }).join("");
    }

    function render() {
      if (!orders.length) {
        document.getElementById("loading-state").hidden = true;
        document.getElementById("error-state").hidden = true;
        document.getElementById("app").hidden = true;
        document.getElementById("empty-state").hidden = false;
        return;
      }
      if (!orders.some(function(order) { return order.id === selectedOrderId; })) selectedOrderId = orders[0].id;
      const order = selectedOrder();
      const signature = JSON.stringify([selectedOrderId, order.status, order.updatedAt, orders.map(function(item) { return [item.id, item.status, item.updatedAt]; })]);
      if (signature === renderSignature) return;
      renderSignature = signature;

      document.getElementById("loading-state").hidden = true;
      document.getElementById("error-state").hidden = true;
      document.getElementById("empty-state").hidden = true;
      document.getElementById("app").hidden = false;
      renderCurrent(order);
      renderHistory();
    }

    async function loadOrders(silent) {
      try {
        const data = await requestJson("/api/customer/orders/history", { method: "POST", body: "{}" });
        orders = data.orders || [];
        render();
        if (!silent) showToast("訂單狀態已更新");
      } catch (error) {
        if (!silent) showError("無法讀取訂單", error.message);
      }
    }

    function closeNotice() {
      const modal = document.getElementById("notice-backdrop");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      noticeAction = null;
    }

    function showNotice(title, copy, rows, actionLabel, action) {
      document.getElementById("notice-title").textContent = title;
      document.getElementById("notice-copy").textContent = copy;
      document.getElementById("notice-list").innerHTML = rows.map(function(row) {
        return '<div class="notice-row"><strong>' + escapeHtml(row.name) + '</strong><br>' +
          escapeHtml(row.reason || row.message) + '</div>';
      }).join("");
      const actionButton = document.getElementById("notice-action");
      actionButton.hidden = !action;
      actionButton.textContent = actionLabel || "確定";
      noticeAction = action || null;
      const modal = document.getElementById("notice-backdrop");
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function mergeCart(nextCart) {
      let cart = {};
      try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch (error) { cart = {}; }
      Object.entries(nextCart).forEach(function(entry) {
        cart[entry[0]] = Number(cart[entry[0]] || 0) + Number(entry[1] || 0);
      });
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    async function reorder(orderId, button) {
      if (!orderId || button.disabled) return;
      button.disabled = true;
      const oldText = button.innerHTML;
      button.textContent = "檢查商品中...";
      try {
        const data = await requestJson("/api/customer/orders/" + encodeURIComponent(orderId) + "/reorder-preview", {
          method: "POST",
          body: "{}"
        });
        const notices = (data.unavailable || []).concat(data.adjustments || []);
        if (!data.availableCount) {
          showNotice("目前無法再次購買", "原訂單中的商品目前都無法加入購物車。", notices, "", null);
          return;
        }

        mergeCart(data.cart);
        localStorage.setItem("reorderDraft", JSON.stringify({
          sourceOrderId: data.sourceOrderId,
          notes: data.notes || "",
          notices: notices,
          createdAt: new Date().toISOString()
        }));

        const goToCart = function() { location.href = "cart.html?reorder=1"; };
        if (notices.length) {
          showNotice("已加入可購買的商品", "部分內容有異動，請確認後再送出訂單。", notices, "前往購物車", goToCart);
        } else {
          showToast("已加入購物車，請確認後再送出");
          setTimeout(goToCart, 650);
        }
      } catch (error) {
        showNotice("無法加入購物車", error.message, [], "", null);
      } finally {
        button.disabled = false;
        button.innerHTML = oldText;
      }
    }

    async function initialize() {
      try {
        const isLocalPreview = (location.hostname === "localhost" || location.hostname === "127.0.0.1") && new URLSearchParams(location.search).get("preview") === "1";
        if (isLocalPreview) {
          const now = new Date();
          orders = [
            {
              id: "preview-2", orderNumber: "18", orderType: "instant", pickupTime: "約 18:40 取餐", paymentMethod: "cash",
              notes: "炒飯少油，謝謝", status: "preparing", totalAmount: 295,
              items: [
                { key: "5-large", name: "蝦仁炒飯（加大）", qty: 1, price: 150, subtotal: 150 },
                { key: "4-normal", name: "香腸炒飯", qty: 1, price: 120, subtotal: 120 },
                { key: "10-normal", name: "海帶芽蛋花湯", qty: 1, price: 25, subtotal: 25 }
              ],
              createdAt: new Date(now.getTime() - 12 * 60 * 1000).toISOString(), updatedAt: now.toISOString()
            },
            {
              id: "preview-1", orderNumber: "7", orderType: "reserve", pickupTime: "09/08 12:00", paymentMethod: "cash",
              notes: "", status: "completed", totalAmount: 240,
              items: [{ key: "9-normal", name: "鹹豬肉", qty: 1, price: 240, subtotal: 240 }],
              createdAt: new Date(now.getTime() - 2 * 86400000).toISOString(), updatedAt: new Date(now.getTime() - 2 * 86400000 + 1800000).toISOString()
            }
          ];
          render();
          return;
        }

        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }
        idToken = liff.getIDToken() || "";
        if (!idToken) throw new Error("尚未取得 LINE 登入授權，請重新開啟頁面。");
        await loadOrders(true);
        setInterval(function() {
          if (!document.hidden) loadOrders(true);
        }, 5000);
      } catch (error) {
        showError("LINE 登入失敗", error.message || "請從 LINE 官方帳號重新開啟訂單紀錄。");
      }
    }

    document.querySelectorAll(".step-dot").forEach(function(dot) { dot.innerHTML = ICONS.dot; });
    document.getElementById("refresh-button").addEventListener("click", function() { loadOrders(false); });
    document.getElementById("retry-button").addEventListener("click", function() { location.reload(); });
    document.getElementById("reorder-current").addEventListener("click", function(event) {
      reorder(event.currentTarget.dataset.orderId, event.currentTarget);
    });
    document.getElementById("history-list").addEventListener("click", function(event) {
      const card = event.target.closest("[data-order-id]");
      if (card) setSelectedOrder(card.dataset.orderId);
    });
    document.getElementById("notice-close").addEventListener("click", closeNotice);
    document.getElementById("notice-action").addEventListener("click", function() {
      const action = noticeAction;
      closeNotice();
      if (action) action();
    });
    document.getElementById("notice-backdrop").addEventListener("click", function(event) {
      if (event.target.id === "notice-backdrop") closeNotice();
    });
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden && idToken) loadOrders(true);
    });

    initialize();
  </script>
</body>
</html>
